# A COPY of what is deployed. The live file is
# vikingvault-infrastructure/devops/argocd-applications/autoscale-platform-simlab-api.yaml,
# which is the GitOps source of truth; this copy is here so that this
# repository states the whole deployment contract on its own. Edit the infra
# repo, then update this. `make check-argocd` fails if the two diverge.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscale-platform-simlab-api
  namespace: argocd
  annotations:
    # Ordering across Applications, which sync-wave on a resource inside
    # one chart cannot do. Effective because these are children of the
    # app-of-apps: after the autoscaler it calls.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # See autoscale-platform-autoscaler.yaml for why this is three Applications
  # rather than the umbrella chart. releaseName must stay "platform".
  source:
    repoURL: https://github.com/casperlundberg/simlab-api
    targetRevision: main
    path: deploy/chart
    helm:
      releaseName: platform
      values: |
        image:
          repository: docker.io/cappelumpa/simlab-api
          # Pinned to the commit CI built. Was unset, which resolves to the
          # chart's appVersion (0.1.0) — a tag nothing has ever published,
          # so every pod sat in ImagePullBackOff from creation.
          #
          # Not "main": that tag moves, so the manifest never changes,
          # ArgoCD sees nothing to sync, and IfNotPresent leaves the running
          # pods on the image they already have. The deploy has to be a
          # change to the tag itself.
          tag: "sha-b66f12714fb9e4a8189058f6b67bb644ff47c9d4"
          pullPolicy: IfNotPresent
        auth:
          # The token callers must present to Simlab's own API -- the browser
          # included, which reads it from the user and sends it as a bearer
          # token.
          #
          # Required because the Ingress publishes this API, not only the
          # browser app: simlab-web's nginx proxies /api straight here. Without
          # it an anonymous POST from the internet created rows on this
          # cluster, and since this service holds the autoscaler's credential
          # and proxies to it, that reached an authenticated autoscaler.
          #
          # sealed-secrets/autoscale-platform/simlab-api-token-sealed.yaml.
          existingSecret: simlab-api-token

        autoscaler:
          # url left unset so the chart resolves http://platform-autoscaler:8080
          # by release name in this namespace.
          existingSecret: autoscaler-api-token
        database:
          embedded:
            enabled: true
            storage: 8Gi
            # longhorn-hugin (3 replicas across hugin-worker, odin-worker-1,
            # thor-worker), not longhorn-single-odin as the app repo's values
            # prefer. This volume holds the record of past runs, which is the
            # one thing here that cannot be re-entered by hand -- scenarios
            # carry seeds, so runs stay reproducible, but the record does not
            # come back. There is still no Longhorn backup target configured,
            # so replication is the only durability this has.
            storageClassName: longhorn-hugin
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            memory: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: autoscale-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  info:
    - name: 'Description'
      value: 'Autoscale platform: simlab-api (Go) + embedded Postgres -- both single replica, Recreate; a run lives in the memory of the process that started it'
