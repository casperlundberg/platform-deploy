# A COPY of what is deployed. The live file is
# vikingvault-infrastructure/devops/argocd-applications/autoscale-platform-simlab-web.yaml,
# which is the GitOps source of truth; this copy is here so that this
# repository states the whole deployment contract on its own. Edit the infra
# repo, then update this. `make check-argocd` fails if the two diverge.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscale-platform-simlab-web
  namespace: argocd
  annotations:
    # Ordering across Applications, which sync-wave on a resource inside
    # one chart cannot do. Effective because these are children of the
    # app-of-apps: after the API it proxies to.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # See autoscale-platform-autoscaler.yaml for why this is three Applications
  # rather than the umbrella chart. releaseName must stay "platform".
  source:
    repoURL: https://github.com/casperlundberg/simlab-web
    targetRevision: main
    path: deploy/chart
    helm:
      releaseName: platform
      values: |
        image:
          repository: docker.io/cappelumpa/simlab-web
          # Pinned to the commit CI built. Was unset, which resolves to the
          # chart's appVersion (0.1.0) — a tag nothing has ever published,
          # so every pod sat in ImagePullBackOff from creation.
          #
          # Not "main": that tag moves, so the manifest never changes,
          # ArgoCD sees nothing to sync, and IfNotPresent leaves the running
          # pods on the image they already have. The deploy has to be a
          # change to the tag itself.
          tag: "sha-d86f7dea8add409dc24b44b557ad47664ade14a5"
          pullPolicy: IfNotPresent
        ingress:
          enabled: true
          # nginx is the only class here and is default; stated anyway so a
          # second class appearing later cannot silently take over.
          className: nginx
          # Named for what it is, rather than for the decommissioned mining
          # simulator whose record this used to reuse. decay.vikingvault.dev
          # still exists and still resolves here; nothing points at it now.
          #
          # simlab is added to the DDNS updater in the same commit that moved
          # this line. It has to be: the updater is what keeps a Cloudflare
          # record pointed at the current external IP, and a name that is not
          # in its list works until the address changes and then stops, which
          # is a failure nobody connects to a DNS list they never looked at.
          #
          # Unlike decay, this record is proxied -- so requests arrive from
          # Cloudflare rather than directly. The ingress annotations that keep
          # the live event stream unbuffered are still set by the chart, but
          # they only govern our own nginx; anything Cloudflare does to a
          # long-lived response it does before we see it.
          host: simlab.vikingvault.dev
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
          tls:
            # The Secret keeps its name rather than being renamed to match the
            # host: cert-manager reissues into it for the new name, where a
            # rename would leave the old certificate behind with nothing owning
            # it. Until that reissue lands, Cloudflare answers 526 for this
            # name, because the origin is still presenting the old certificate.
            - secretName: autoscale-platform-tls
              hosts:
                - simlab.vikingvault.dev
        # proxy-buffering "off" and proxy-read-timeout 86400 are baked into the
        # chart's ingress template, not set here -- without them live runs look
        # frozen and nothing in the logs says why.
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: autoscale-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  info:
    - name: 'Description'
      value: 'Autoscale platform: simlab-web SPA at simlab.vikingvault.dev -- its nginx proxies /api, so one ingress rule covers the whole app and the backend needs no CORS'
