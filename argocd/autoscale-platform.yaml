# The whole platform as a single ArgoCD Application, via the umbrella chart.
#
# THIS FILE IS THE ALTERNATIVE THAT WAS NOT CHOSEN, kept because it becomes
# the better arrangement the moment the service charts are published to an OCI
# registry. As written it does not work: the umbrella chart's dependencies are
# file:// paths to the sibling repositories, and ArgoCD's repo-server has no
# siblings to resolve them against.
#
# What is deployed instead is one Application per service —
# argocd/{autoscaler,simlab-api,simlab-web}.yaml — which works because each
# service chart has no dependencies at all. Item 8 in docs/infra-handover.md
# has the comparison.
#
# To use this file instead: publish the three service charts to OCI, replace
# the file:// repositories in charts/autoscale-platform/Chart.yaml with their
# OCI references, and delete the three per-service Applications. Nothing else
# changes — values/vikingvault.yaml is already the same configuration the
# three per-service files carry, and `make check-values` proves it.
#
# THIS FILE IS A REFERENCE. It is not applied from here and should not be.
# Decisions the infra repo owns are marked CLUSTER.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscale-platform
  namespace: argocd
  # CLUSTER: the finalizer controls whether removing the Application also
  # removes its workloads. Every other Application in the infra repo has an
  # opinion about this; match it rather than this file.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # CLUSTER: which ArgoCD project this belongs to, and what that project
  # permits.
  project: default

  source:
    # Works only once Chart.yaml names OCI references instead of file://
    # paths — see the header.
    repoURL: https://github.com/casperlundberg/platform-deploy
    targetRevision: main
    path: charts/autoscale-platform
    # The release name the three per-service Applications pin explicitly. Here
    # it comes free: one release, and the charts resolve each other from it.
    helm:
      releaseName: platform
      valueFiles:
        - ../../values/vikingvault.yaml

  destination:
    server: https://kubernetes.default.svc
    # Clean sheet — nothing of this project is left on the cluster (checked
    # 2026-09-11), so it takes its own namespace.
    namespace: autoscale-platform

  syncPolicy:
    automated:
      prune: true
      # CLUSTER: selfHeal is on for most Applications here. Note that it is
      # what makes a direct `helm install` or `kubectl patch` get silently
      # reverted.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The autoscaler writes its own Secrets (ColonyOS executor keys). Not
      # chart-managed — pruning them crash-loops every executor pod.
      - ApplyOutOfSyncOnly=true
