# An ArgoCD Application for the platform, written the way the infrastructure
# repository would need it.
#
# THIS FILE IS A REFERENCE. It is not applied from here and should not be.
# Copy it into vikingvault-infrastructure at
# devops/argocd-applications/autoscale-platform.yaml, adjust it to that
# repository's conventions, and let ArgoCD deploy from there.
#
# Three things below are decisions the infra repo owns, marked CLUSTER:
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscale-platform
  namespace: argocd
  # CLUSTER: the finalizer controls whether removing the Application also
  # removes its workloads. Every other Application in the infra repo has an
  # opinion about this; match it rather than this file.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # CLUSTER: which ArgoCD project this belongs to, and what that project
  # permits.
  project: default

  source:
    # CLUSTER: where the chart is read from. The file:// dependencies below
    # will not resolve for ArgoCD's repo-server, so either publish the three
    # service charts to OCI and switch Chart.yaml, or reproduce the manifests
    # in the infra repo. See docs/infra-handover.md item 8.
    repoURL: https://github.com/casperlundberg/platform-deploy
    targetRevision: main
    path: charts/autoscale-platform
    helm:
      valueFiles:
        - ../../values/vikingvault.yaml

  destination:
    server: https://kubernetes.default.svc
    # Clean sheet — nothing of this project is left on the cluster (checked
    # 2026-09-11), so it takes its own namespace.
    namespace: autoscale-platform

  syncPolicy:
    automated:
      prune: true
      # CLUSTER: selfHeal is on for most Applications here. Note that it is
      # what makes a direct `helm install` or `kubectl patch` get silently
      # reverted.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The autoscaler writes its own Secrets (ColonyOS executor keys). Not
      # chart-managed — pruning them crash-loops every executor pod.
      - ApplyOutOfSyncOnly=true
