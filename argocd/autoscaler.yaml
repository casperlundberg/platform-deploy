# A COPY of what is deployed. The live file is
# vikingvault-infrastructure/devops/argocd-applications/autoscale-platform-autoscaler.yaml,
# which is the GitOps source of truth; this copy is here so that this
# repository states the whole deployment contract on its own. Edit the infra
# repo, then update this. `make check-argocd` fails if the two diverge.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscale-platform-autoscaler
  namespace: argocd
  annotations:
    # Ordering across Applications, which sync-wave on a resource inside
    # one chart cannot do. Effective because these are children of the
    # app-of-apps: before simlab-api, which calls it.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # The umbrella chart in platform-deploy resolves its three services through
  # file:// dependencies, which ArgoCD's repo-server cannot follow, and the
  # repo deliberately gitignores the vendored .tgz copies. Each service chart
  # is self-contained in its own public repo, so they are deployed as three
  # Applications instead -- the same shape fishing-planner already uses here.
  #
  # releaseName MUST stay "platform" in all three: the charts resolve each
  # other as {{ .Release.Name }}-autoscaler and {{ .Release.Name }}-simlab-api.
  # Verified 2026-09-13 -- the three charts rendered separately at this release
  # name are byte-identical to `make template VALUES=values/vikingvault.yaml`.
  source:
    repoURL: https://github.com/casperlundberg/autoscaler
    targetRevision: main
    path: deploy/chart
    helm:
      releaseName: platform
      values: |
        image:
          repository: docker.io/cappelumpa/autoscaler
          # Pinned to the commit CI built. Was unset, which resolves to the
          # chart's appVersion (0.1.0) — a tag nothing has ever published, so
          # every pod sat in ImagePullBackOff from the moment it was created.
          #
          # Not "main": that tag moves, so the manifest never changes, ArgoCD
          # sees nothing to sync, and IfNotPresent leaves the running pods on
          # the image they already have. The deploy has to be a change to the
          # tag itself.
          tag: "sha-d02c1162d08bc5ab7ba2288700c4d8252e74bbf8"
          pullPolicy: IfNotPresent
        auth:
          # sealed-secrets/autoscale-platform/api-token-sealed.yaml.
          # Must exist before first sync: unset, the autoscaler runs
          # unauthenticated while holding other systems' credentials.
          existingSecret: autoscaler-api-token
        persistence:
          enabled: true
          size: 1Gi
          # Holds targets.json -- Kubernetes tokens, ColonyOS keys, Docker
          # certs, mode 0600, in the clear. One replica on odin-worker-2/disk-4
          # with no backup target: losing it costs re-entering each target's
          # credentials, which is recoverable by hand. No run data here.
          storageClassName: longhorn-single-odin
        rbac:
          create: true
          # Empty = its own namespace only. No ClusterRole is offered by the
          # chart. Widen this when the autoscaler needs to provision pools
          # elsewhere; each entry adds one namespace-scoped Role.
          namespaces: []
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: autoscale-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The autoscaler writes Secrets of its own (ColonyOS executor keys its
      # pods read). They are not chart-managed and must survive a sync.
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  info:
    - name: 'Description'
      value: 'Autoscale platform: autoscaler (Go) -- single replica, Recreate, holds platform credentials on disk'
