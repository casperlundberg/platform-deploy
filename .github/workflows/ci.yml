name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chart:
    runs-on: ubuntu-latest
    # Every run step is inside this repository, which is not the workspace
    # root here — see the checkout comment below.
    defaults:
      run:
        working-directory: platform-deploy
    steps:
      # The umbrella chart depends on three charts that live in the sibling
      # repositories, so CI has to reproduce the side-by-side layout they are
      # worked on in. actions/checkout refuses any path outside the workspace,
      # so the siblings cannot be placed above this repository; this
      # repository goes into a subdirectory instead and they sit beside it,
      # which is exactly what file://../../../<service>/deploy/chart resolves
      # to from charts/autoscale-platform.
      - uses: actions/checkout@v4
        with: { path: platform-deploy }
      - uses: actions/checkout@v4
        with: { repository: casperlundberg/autoscaler, path: autoscaler }
      - uses: actions/checkout@v4
        with: { repository: casperlundberg/simlab-api, path: simlab-api }
      - uses: actions/checkout@v4
        with: { repository: casperlundberg/simlab-web, path: simlab-web }

      - uses: azure/setup-helm@v4
      - run: make lint
      - run: make template-all

      # The cluster is deployed from values/vikingvault/, one file per ArgoCD
      # Application, while values/vikingvault.yaml says the same thing for the
      # umbrella chart. Editing one and not the other is the mistake this
      # catches, and it is silent otherwise — both files render perfectly well
      # on their own.
      - run: make check-values

      # A rendered manifest that is not valid Kubernetes is worth catching
      # here rather than in an ArgoCD sync failure. This was
      # `kubectl apply --dry-run=client`, which cannot do it on a runner:
      # client-side validation still fetches the schema from a cluster, so
      # with no kubeconfig every file failed on a refused connection to
      # localhost and nothing was ever validated. kubeconform carries the
      # schemas itself, and -strict additionally refuses a field no
      # Kubernetes API knows — which is the mistake a rendered template
      # actually makes.
      - run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          ./kubeconform -strict -summary out/*.yaml

  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck verify.sh scripts/*.sh
