# A laptop cluster — kind, k3d, minikube, Docker Desktop.
#
# Self-contained: the Postgres comes with it, nothing is exposed, and the API
# token is a literal because nothing here is worth protecting. Do not copy this
# file as the basis for a real environment; copy vikingvault.yaml.

storage:
  # The Longhorn requirement is waived here, and only here, because a laptop
  # cluster has no Longhorn to satisfy it with. Every real environment leaves
  # this true.
  requireLonghorn: false

# Every service takes the moving "main" tag here, and that is the opposite of
# what vikingvault does. The reason they differ: ArgoCD deploys by noticing the
# manifest changed, and a manifest naming "main" never changes, so a GitOps
# deploy must pin a sha. `helm install` has no such problem -- it pulls
# whatever "main" points at, today, which is what someone trying the system out
# wants. Leaving it unset is the one thing that does not work: the chart falls
# back to appVersion 0.1.0, which nothing has ever published, and every pod
# sits in ImagePullBackOff.
autoscaler:
  image:
    tag: "main"
    # main moves, so a cached copy from last week is not the one meant.
    pullPolicy: Always
  auth:
    # Fine here and nowhere else.
    token: "local-development-token"
  persistence:
    enabled: true
    size: 1Gi
    # kind, k3d and minikube ship exactly one default StorageClass, so an empty
    # value binds predictably. On a cluster with two defaults marked it does
    # not — see vikingvault.yaml.
    storageClassName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

simlab-api:
  image:
    tag: "main"
    pullPolicy: Always
  autoscaler:
    token: "local-development-token"
  database:
    embedded:
      enabled: true
      storage: 2Gi
      storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

simlab-web:
  image:
    tag: "main"
    pullPolicy: Always
  ingress:
    # Reach it with a port-forward instead:
    #   kubectl -n autoscale-platform port-forward svc/platform-simlab-web 8080:8080
    enabled: false
