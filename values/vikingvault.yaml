# The vikingvault-ts cluster.
#
# This file records what that cluster requires. It is a starting point for the
# infrastructure repository, not a substitute for it: that repository is the
# GitOps source of truth, and this chart must never be helm-installed here.
# ArgoCD manages with selfHeal on, so a direct install creates a second owner
# and gets reverted.
#
# Every value below was read off the cluster on 2026-09-11, not assumed:
#
#   9 nodes; odin-worker-1..4 are the large ones at 6 CPU / 24Gi each
#   StorageClasses: local-path (default), longhorn-hugin (default),
#     longhorn, longhorn-single-odin  ← two defaults, hence no implicit choice
#   longhorn-single-odin: numberOfReplicas 1, reclaimPolicy Delete,
#     allowVolumeExpansion true, diskSelector single-replica
#   IngressClass: nginx only, and marked default
#   sealed-secrets controller in kube-system
#   40 ArgoCD Applications, none belonging to this project
#
# If one of them changes, it changes here and in the infra repo, not in the
# chart.

autoscaler:
  image:
    # The repository is the chart's own default; only the pull policy is worth
    # stating per cluster.
    pullPolicy: IfNotPresent

  auth:
    # A SealedSecret in the infra repo under sealed-secrets/<namespace>/.
    # Never a literal here.
    existingSecret: autoscaler-api-token

  persistence:
    enabled: true
    size: 1Gi
    # REQUIRED on this cluster. Two StorageClasses are marked default
    # (local-path and longhorn-hugin), so a PVC with no explicit class binds
    # unpredictably — it is not a "pick the sensible one" situation.
    #
    # Two properties of this class matter for a volume holding access keys:
    #   numberOfReplicas: 1 — losing the node loses the volume
    #   reclaimPolicy: Delete — removing the release destroys it
    # Either one costs every registered target's credentials, which then have
    # to be re-entered. That is recoverable but not free; see
    # docs/resources.md.
    storageClassName: longhorn-single-odin

  rbac:
    create: true
    # The namespaces this autoscaler may create and scale Deployments in.
    # Left empty it can only act in its own, which is the right default and
    # probably not what a real deployment wants. Set it deliberately.
    namespaces: []

  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

simlab-api:
  image:
    pullPolicy: IfNotPresent

  autoscaler:
    existingSecret: autoscaler-api-token

  database:
    embedded:
      enabled: true
      storage: 8Gi
      storageClassName: longhorn-single-odin
      # The embedded Postgres is fine for this workload — one writer, a few
      # thousand rows per run. Point database.existingSecret at a managed
      # instance if runs are ever to be kept long-term.

  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 1Gi }

simlab-web:
  image:
    pullPolicy: IfNotPresent

  ingress:
    enabled: true
    # nginx is the only IngressClass here and is marked default, so this is
    # redundant — and stated anyway, because a second class appearing later
    # would silently change which one an unspecified Ingress picked up.
    className: nginx
    host: ""   # set by the infra repo, which owns the DNS
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls: []

  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
