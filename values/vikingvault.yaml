# The vikingvault-ts cluster.
#
# Read off the cluster 2026-09-11, not assumed. A starting point for the infra
# repo, which is the GitOps source of truth — never helm-install this here,
# ArgoCD manages with selfHeal and would revert it.
#
#   StorageClasses: local-path and longhorn-hugin both default (hence no
#     implicit choice); longhorn-single-odin is 1 replica on one tagged disk,
#     odin-worker-2/disk-4, reclaimPolicy Delete, no backup target configured
#   IngressClass: nginx only, and default
#   sealed-secrets in kube-system
#   odin-worker-1..4 are 6 CPU / 24Gi; nothing of this project is on the
#     cluster any more

autoscaler:
  image:
    # The repository is the chart's own default; only the pull policy is worth
    # stating per cluster.
    pullPolicy: IfNotPresent

  auth:
    # A SealedSecret in the infra repo under sealed-secrets/<namespace>/.
    # Never a literal here.
    existingSecret: autoscaler-api-token

  persistence:
    enabled: true
    size: 1Gi
    # REQUIRED on this cluster. Two StorageClasses are marked default
    # (local-path and longhorn-hugin), so a PVC with no explicit class binds
    # unpredictably — it is not a "pick the sensible one" situation.
    #
    # Longhorn only — the chart refuses anything else, and refuses an unset
    # value too. See charts/autoscale-platform/templates/validate-storage.yaml.
    #
    # Matches the live PVC, whose storageClassName is immutable. See
    # docs/infra-handover.md item 2 — this is arguably the wrong pool for a
    # credential store, and moving it is a migration rather than an edit.
    storageClassName: longhorn-single-odin

  rbac:
    create: true
    # Namespaces it may create and scale Deployments in. Empty = its own only.
    # Right default, probably not what a real deployment wants.
    namespaces: []

  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

simlab-api:
  image:
    pullPolicy: IfNotPresent

  autoscaler:
    existingSecret: autoscaler-api-token

  database:
    embedded:
      enabled: true
      storage: 8Gi
      # Matches the live PVC, which is on the 3-replica pool.
      storageClassName: longhorn-hugin

  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 1Gi }

simlab-web:
  image:
    pullPolicy: IfNotPresent

  ingress:
    enabled: true
    # Redundant (nginx is the only class and is default) but explicit, so a
    # second class appearing later cannot silently take over.
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    # Recorded, not decided, here — the infra repo owns the DNS. Never empty:
    # the chart renders `host: ""`, which matches every host on the controller.
    host: simlab.vikingvault.dev
    tls:
      - secretName: simlab-tls
        hosts:
          - simlab.vikingvault.dev

  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
